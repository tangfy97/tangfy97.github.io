<!doctype html>
<html>
  {% include head.html %}
  <body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
    <div class="container">
      {% unless page.body_class == "admin-page" %}
        {% include header.html %}
      {% endunless %}
      <div class="content-wrapper">
        {{ content }}
      </div>
      {% unless page.body_class == "admin-page" %}
        {% include footer.html %}
      {% endunless %}
    </div>
  </body>
</html>
